[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "psf-iaminy"
version = "0.1.0"
description = "PSF-IAminy — conhecimento de Matemática e Português construído do zero, com rastreabilidade obrigatória (projeto Pensador Sem Fronteiras)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Progaminy" }]
keywords = ["knowledge-representation", "mathematics", "natural-language-processing", "traceability", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/Progaminy/PSF-IAminy-Open"
Changelog = "https://github.com/Progaminy/PSF-IAminy-Open/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Progaminy/PSF-IAminy-Open/blob/main/COMO_RODAR.md"
Issues = "https://github.com/Progaminy/PSF-IAminy-Open/issues"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "bandit"]

[project.scripts]
psf-iaminy = "psf_iaminy:main"

[tool.setuptools]
py-modules = ["main", "psf", "psf_chat", "motor_iaminy", "caixa", "estatistica", "verificar_integridade"]
packages = [
    "conhecimento",
    "nucleo",
    "matematica",
    "lingua_portuguesa",
    "lingua_portuguesa.dados",
    "motor",
    "modelos",
    "ensino",
    "interface",
    "interface.estatico",
    "validacao_externa",
    "psf_iaminy",
    "dados",
    "testes",
    "testes.aceitacao",
]


[tool.setuptools.package-data]
conhecimento = ["*.md"]
"lingua_portuguesa.dados" = ["*.json"]
interface = ["estatico/*.html", "estatico/*.css", "estatico/*.js"]
ensino = ["*.json"]
motor = ["*.json"]
dados = ["*.jsonl"]

[tool.setuptools.data-files]
"share/psf-iaminy" = ["*.md", "LICENSE", "CITATION.cff"]
