name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    name: Testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependências de teste
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Verificar integridade básica
        run: python3 verificar_integridade.py

      - name: Rodar testes com cobertura
        run: python3 -m pytest -q --cov --cov-report=term-missing --cov-report=xml

      - name: Upload do relatório de cobertura
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  qualidade:
    name: Análise estática (informativa, não bloqueante)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ferramentas
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit

      - name: Ruff (estilo e erros óbvios)
        run: ruff check . --exclude cao_de_caca

      - name: Bandit (padrões de risco de segurança)
        run: bandit -r . -x ./cao_de_caca,./testes
