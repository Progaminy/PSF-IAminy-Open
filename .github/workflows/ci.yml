name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    name: Testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar pacote e dependências de teste
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-cov
          python -m pip check

      - name: Verificar integridade básica
        run: python verificar_integridade.py

      - name: Rodar testes com cobertura
        run: python -m pytest -q --cov --cov-report=term-missing --cov-report=xml

      - name: Upload do relatório de cobertura
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: coverage-xml
          path: coverage.xml

  empacotamento:
    name: Instalação e demonstração públicas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"

      - name: Construir wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build --wheel

      - name: Instalar e verificar wheel fora da fonte
        run: |
          python -m venv /tmp/psf-wheel
          /tmp/psf-wheel/bin/python -m pip install dist/*.whl
          /tmp/psf-wheel/bin/python -m pip check
          cd /tmp
          PSF_IAMINY_DATA_DIR=/tmp/psf-data /tmp/psf-wheel/bin/psf-iaminy --selftest
          PSF_IAMINY_DATA_DIR=/tmp/psf-data /tmp/psf-wheel/bin/python -m psf_iaminy --selftest
          PSF_IAMINY_DATA_DIR=/tmp/psf-data /tmp/psf-wheel/bin/python - <<'PY'
          from pathlib import Path
          import interface
          from interface.conversas import CAMINHO_PADRAO
          from lingua_portuguesa.corretor import Corretor
          from motor.geral import MotorGeralIAMiny
          from motor.identidade_humana import RegistroIdentidadeHumana
          from motor.rastreabilidade import referencias_quebradas
          from nucleo.chat_auditoria import CAMINHO_AUDITORIA
          from psf_iaminy.recursos import caminho_documento, raiz_dados_usuario

          assert Corretor().corrigir_texto("Ela nao sabia nda.").original
          motor = MotorGeralIAMiny()
          assert motor.plano_visivel()
          assert motor.regra_versao_unica()
          assert referencias_quebradas() == {}
          assert caminho_documento("README.md").is_file()
          assert (Path(interface.__file__).parent / "estatico" / "index.html").is_file()
          assert raiz_dados_usuario() == Path("/tmp/psf-data")
          assert str(CAMINHO_PADRAO).startswith("/tmp/psf-data/")
          assert str(CAMINHO_AUDITORIA).startswith("/tmp/psf-data/")
          RegistroIdentidadeHumana().registrar_fatos(["teste de instalação"])
          assert Path("/tmp/psf-data/motor/identidade_humana.json").is_file()
          PY

      - name: Verificar demonstrações na árvore pública
        run: |
          python exemplo_publico.py
          python exemplos/matematica.py
          python exemplos/portugues.py
          python exemplos/rastreabilidade.py

  qualidade:
    name: Análise estática (crítica + dívida informativa)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"

      - name: Instalar ferramentas
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.15.22 bandit==1.9.4

      - name: Ruff (erros críticos bloqueantes)
        run: ruff check . --exclude cao_de_caca --select E9,F63,F7,F82

      - name: Ruff (relatório completo informativo)
        if: always()
        continue-on-error: true
        run: ruff check . --exclude cao_de_caca

      - name: Bandit (severidade média/alta bloqueante)
        if: always()
        run: bandit -r . -x ./cao_de_caca,./testes -ll

      - name: Bandit (relatório completo informativo)
        if: always()
        continue-on-error: true
        run: bandit -r . -x ./cao_de_caca,./testes
